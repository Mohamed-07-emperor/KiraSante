services:
  - type: web
    name: kirasante-api
    runtime: node
    buildCommand: npm install
    startCommand: node src/server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: kirasante-db
          property: connectionString

databases:
  - name: kirasante-db
    plan: free
