services:
  - type: web
    name: kirasante-api
    runtime: node
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: kirasante-db
          property: connectionString

databases:
  - name: kirasante-db
    databaseName: kirasante
    plan: free
