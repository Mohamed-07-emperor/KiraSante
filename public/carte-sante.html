<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0F6E5C" />
  <title>KiraSante BF — Carte Santé</title>
  <link rel="stylesheet" href="/css/design-system.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: var(--font-corps); background: var(--fond-chaud); min-height: 100dvh; }
    .page { display: flex; flex-direction: column; min-height: 100dvh; }

    .header { background: var(--vert-clinique); padding: var(--space-4) var(--space-5); display: flex; align-items: center; gap: var(--space-3); }
    .btn-retour { background: rgba(255,255,255,0.15); border: none; border-radius: var(--radius-md); padding: var(--space-2); color: #fff; cursor: pointer; display: flex; align-items: center; }
    .header-titre { font-family: var(--font-display); font-size: var(--text-lg); font-weight: 600; color: #fff; flex: 1; }
    .statut-point { width: 8px; height: 8px; border-radius: 50%; background: #4ADE80; box-shadow: 0 0 6px rgba(74,222,128,0.6); }

    .filtres { display: flex; gap: var(--space-2); padding: var(--space-3) var(--space-4); background: var(--fond-carte); border-bottom: 1px solid var(--bordure); overflow-x: auto; }
    .filtre-btn { display: flex; align-items: center; gap: var(--space-1); padding: var(--space-2) var(--space-3); background: var(--fond-chaud); border: 1.5px solid var(--bordure); border-radius: var(--radius-full); font-family: var(--font-corps); font-size: var(--text-xs); font-weight: 500; color: var(--texte-secondaire); cursor: pointer; white-space: nowrap; transition: all var(--transition-fast); }
    .filtre-btn.actif { background: var(--vert-clinique); color: #fff; border-color: var(--vert-clinique); }
    .filtre-btn.urgence.actif { background: var(--rouge-alerte); border-color: var(--rouge-alerte); }
    .filtre-btn.pharmacie.actif { background: #7C3AED; border-color: #7C3AED; }

    .search-container { padding: var(--space-3) var(--space-4); background: var(--fond-carte); }
    .search-bar { display: flex; align-items: center; gap: var(--space-3); background: var(--fond-chaud); border: 1.5px solid var(--bordure); border-radius: var(--radius-md); padding: var(--space-3) var(--space-4); }
    .search-bar input { flex: 1; border: none; outline: none; font-family: var(--font-corps); font-size: var(--text-sm); background: transparent; color: var(--texte-principal); }
    .search-bar input::placeholder { color: var(--texte-doux); }

    #map { height: 320px; width: 100%; }

    .ma-position-btn { position: absolute; bottom: 340px; right: 12px; z-index: 1000; background: var(--fond-carte); border: none; border-radius: var(--radius-md); padding: var(--space-3); box-shadow: var(--shadow-md); cursor: pointer; display: flex; align-items: center; justify-content: center; }

    .resultats { flex: 1; overflow-y: auto; padding: var(--space-4); padding-bottom: 80px; }
    .resultats-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: var(--space-3); }
    .resultats-titre { font-family: var(--font-display); font-size: var(--text-base); font-weight: 600; color: var(--texte-principal); }
    .resultats-count { font-size: var(--text-xs); color: var(--texte-doux); font-family: var(--font-mono); }

    .centre-item { background: var(--fond-carte); border-radius: var(--radius-md); padding: var(--space-4); margin-bottom: var(--space-2); box-shadow: var(--shadow-sm); display: flex; align-items: flex-start; gap: var(--space-3); cursor: pointer; transition: all var(--transition-fast); border-left: 3px solid transparent; }
    .centre-item:hover { box-shadow: var(--shadow-md); transform: translateX(2px); }
    .centre-item.chu { border-left-color: #7C3AED; }
    .centre-item.chr { border-left-color: var(--bleu-nuit); }
    .centre-item.cma { border-left-color: var(--vert-clinique); }
    .centre-item.csps { border-left-color: var(--vert-actif); }
    .centre-item.clinique { border-left-color: var(--orange-burkina); }
    .centre-item.pharmacie { border-left-color: #7C3AED; }

    .centre-icone { width: 40px; height: 40px; border-radius: var(--radius-md); display: flex; align-items: center; justify-content: center; font-size: 1.2rem; flex-shrink: 0; }
    .centre-icone.chu { background: #EDE9FE; }
    .centre-icone.chr { background: #EEF6FF; }
    .centre-icone.cma { background: var(--vert-clair); }
    .centre-icone.csps { background: #F0FDF4; }
    .centre-icone.clinique { background: var(--orange-clair); }
    .centre-icone.pharmacie { background: #EDE9FE; }

    .centre-info { flex: 1; }
    .centre-nom { font-size: var(--text-sm); font-weight: 600; color: var(--texte-principal); line-height: 1.3; }
    .centre-type { font-size: var(--text-xs); color: var(--texte-doux); margin-top: 2px; }
    .centre-distance { font-size: var(--text-xs); font-family: var(--font-mono); color: var(--vert-clinique); font-weight: 600; }
    .centre-actions { display: flex; gap: var(--space-2); margin-top: var(--space-2); }
    .btn-appel { display: flex; align-items: center; gap: 4px; padding: 4px 10px; background: var(--vert-clair); border: none; border-radius: var(--radius-full); font-size: var(--text-xs); color: var(--vert-clinique); font-weight: 600; cursor: pointer; text-decoration: none; }
    .btn-itineraire { display: flex; align-items: center; gap: 4px; padding: 4px 10px; background: var(--orange-clair); border: none; border-radius: var(--radius-full); font-size: var(--text-xs); color: #B87A00; font-weight: 600; cursor: pointer; }
    .badge-urgence { font-size: 9px; font-weight: 700; padding: 1px 6px; background: #FDE8E8; color: var(--rouge-alerte); border-radius: var(--radius-full); }
    .badge-horaires { font-size: 9px; color: var(--texte-doux); margin-top: 2px; }

    .nav-bas { position: fixed; bottom: 0; left: 0; right: 0; background: var(--fond-carte); border-top: 1px solid var(--bordure); display: flex; z-index: 50; padding-bottom: env(safe-area-inset-bottom); box-shadow: 0 -4px 16px rgba(10,61,98,0.08); }
    .nav-item { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 3px; padding: var(--space-3) var(--space-2); background: none; border: none; cursor: pointer; color: var(--texte-doux); font-size: 10px; font-family: var(--font-corps); font-weight: 500; transition: color var(--transition-fast); text-decoration: none; }
    .nav-item.actif { color: var(--vert-clinique); }
    .nav-item svg { stroke: currentColor; }

    .etat-chargement { display: flex; flex-direction: column; align-items: center; gap: var(--space-3); padding: var(--space-8) 0; color: var(--texte-doux); font-size: var(--text-sm); }
    .loading-ecg { width: 80px; height: 2px; background: var(--bordure); border-radius: 9999px; overflow: hidden; }
    .loading-ecg::after { content: ''; display: block; width: 40%; height: 100%; background: var(--vert-clinique); border-radius: 9999px; animation: ecg-scan 1s ease-in-out infinite; }
    @keyframes ecg-scan { 0% { transform: translateX(-100%); } 100% { transform: translateX(350%); } }

    .section-urgence { background: #FDE8E8; border-radius: var(--radius-md); padding: var(--space-3) var(--space-4); margin-bottom: var(--space-3); display: flex; align-items: center; gap: var(--space-3); }
    .section-urgence-texte { font-size: var(--text-sm); font-weight: 600; color: var(--rouge-alerte); }
    .section-urgence-num { font-family: var(--font-mono); font-size: var(--text-lg); font-weight: 700; color: var(--rouge-alerte); }
  </style>
</head>
<body>
<div class="page">

  <header class="header">
    <button class="btn-retour" onclick="history.back()">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 18 9 12 15 6"/></svg>
    </button>
    <span class="header-titre">Centres de santé & Pharmacies</span>
    <div class="statut-point" id="statut-gps"></div>
  </header>

  <!-- URGENCE -->
  <div class="section-urgence">
    <span style="font-size:1.5rem">🚨</span>
    <div>
      <div class="section-urgence-texte">Urgence médicale ?</div>
      <a href="tel:112" class="section-urgence-num">112 — SAMU</a>
    </div>
  </div>

  <!-- RECHERCHE -->
  <div class="search-container">
    <div class="search-bar">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <input type="text" id="search-input" placeholder="Rechercher un centre, pharmacie…" oninput="filtrer(this.value)" />
    </div>
  </div>

  <!-- FILTRES -->
  <div class="filtres">
    <button class="filtre-btn actif" data-filtre="tous" onclick="changerFiltre('tous', this)">🏥 Tous</button>
    <button class="filtre-btn" data-filtre="urgence" onclick="changerFiltre('urgence', this)">🚨 Urgences</button>
    <button class="filtre-btn" data-filtre="CHU" onclick="changerFiltre('CHU', this)">🏛️ CHU</button>
    <button class="filtre-btn" data-filtre="CHR" onclick="changerFiltre('CHR', this)">🏥 CHR</button>
    <button class="filtre-btn" data-filtre="CMA" onclick="changerFiltre('CMA', this)">🏨 CMA</button>
    <button class="filtre-btn" data-filtre="CSPS" onclick="changerFiltre('CSPS', this)">🏠 CSPS</button>
    <button class="filtre-btn pharmacie" data-filtre="pharmacie" onclick="changerFiltre('pharmacie', this)">💊 Pharmacies</button>
  </div>

  <!-- CARTE -->
  <div style="position:relative">
    <div id="map"></div>
    <button class="ma-position-btn" onclick="centrerSurMoi()" title="Ma position">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="var(--vert-clinique)" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/><circle cx="12" cy="12" r="8" stroke-dasharray="2 2"/></svg>
    </button>
  </div>

  <!-- RÉSULTATS -->
  <div class="resultats">
    <div class="resultats-header">
      <span class="resultats-titre">Centres de santé</span>
      <span class="resultats-count" id="count-resultats">Chargement…</span>
    </div>
    <div id="liste-centres">
      <div class="etat-chargement"><div class="loading-ecg"></div><span>Localisation en cours…</span></div>
    </div>
  </div>

  <!-- NAV BAS -->
  <nav class="nav-bas">
    <a href="/dashboard-agent.html" class="nav-item">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>
      <span>Accueil</span>
    </a>
    <a href="/carte-sante.html" class="nav-item actif">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="1 6 1 22 8 18 16 22 23 18 23 2 16 6 8 2 1 6"/></svg>
      <span>Carte</span>
    </a>
    <a href="/scan-qr.html" class="nav-item">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
      <span>Scanner</span>
    </a>
    <a href="/vaccinations.html" class="nav-item">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14.5 12.5l-8 8a2.121 2.121 0 0 1-3-3l8-8"/></svg>
      <span>Vaccins</span>
    </a>
  </nav>

</div>

<script>
let maPosition = null;
let map = null;
let markersMap = [];
let filtreActuel = 'tous';
let recherche = '';
let donnees = { centres: [], pharmacies: [] };

// Icônes par type
const ICONES = {
  CHU: '🏛️', CHR: '🏥', CMA: '🏨', CSPS: '🏠',
  Clinique: '🏩', pharmacie: '💊'
};

const COULEURS = {
  CHU: '#7C3AED', CHR: '#0A3D62', CMA: '#0F6E5C',
  CSPS: '#1E8C73', Clinique: '#F2A640', pharmacie: '#7C3AED'
};

function distance(lat1, lng1, lat2, lng2) {
  const R = 6371;
  const dLat = (lat2 - lat1) * Math.PI / 180;
  const dLng = (lng2 - lng1) * Math.PI / 180;
  const a = Math.sin(dLat/2)**2 + Math.cos(lat1*Math.PI/180) * Math.cos(lat2*Math.PI/180) * Math.sin(dLng/2)**2;
  return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
}

function formatDistance(km) {
  if (km < 1) return Math.round(km * 1000) + ' m';
  return km.toFixed(1) + ' km';
}

async function chargerDonnees() {
  const res = await fetch('/data/structures-sante.json');
  donnees = await res.json();
}

function initCarte(lat, lng) {
  if (map) map.remove();
  map = L.map('map').setView([lat, lng], 13);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '© OpenStreetMap', maxZoom: 18
  }).addTo(map);

  // Marqueur position utilisateur
  if (maPosition) {
    L.circleMarker([maPosition.lat, maPosition.lng], {
      radius: 8, fillColor: '#0F6E5C', color: '#fff', weight: 2, fillOpacity: 1
    }).addTo(map).bindPopup('📍 Votre position');
  }
}

function ajouterMarqueurs(items, type) {
  items.forEach(item => {
    if (!item.lat || !item.lng) return;
    const couleur = COULEURS[type] || COULEURS[item.type] || '#0F6E5C';
    const icone = L.divIcon({
      html: `<div style="background:${couleur};color:white;border-radius:50%;width:28px;height:28px;display:flex;align-items:center;justify-content:center;font-size:13px;border:2px solid white;box-shadow:0 2px 6px rgba(0,0,0,0.25)">${ICONES[type] || ICONES[item.type] || '🏥'}</div>`,
      className: '', iconSize: [28, 28], iconAnchor: [14, 14]
    });
    const marker = L.marker([item.lat, item.lng], { icon: icone }).addTo(map);
    marker.bindPopup(`
      <div style="font-family:system-ui;min-width:160px">
        <strong>${item.nom}</strong><br>
        <span style="color:#4A6572;font-size:11px">${item.type || 'Pharmacie'}</span><br>
        ${item.telephone ? `📞 <a href="tel:${item.telephone}">${item.telephone}</a><br>` : ''}
        ${item.horaires ? `⏰ ${item.horaires}` : ''}
        ${item.urgences ? '<br><span style="color:#D94F4F;font-weight:700">🚨 Urgences 24h/24</span>' : ''}
      </div>
    `);
    markersMap.push(marker);
  });
}

function afficherListe(items, type) {
  const liste = document.getElementById('liste-centres');
  const count = document.getElementById('count-resultats');
  if (!items.length) {
    liste.innerHTML = '<div class="etat-chargement"><span>Aucun résultat trouvé</span></div>';
    count.textContent = '0 résultat';
    return;
  }
  count.textContent = `${items.length} résultat${items.length > 1 ? 's' : ''}`;
  liste.innerHTML = items.map(item => {
    const dist = maPosition ? distance(maPosition.lat, maPosition.lng, item.lat, item.lng) : null;
    const typeClass = (item.type || type || 'csps').toLowerCase().replace(' ', '');
    return `
      <div class="centre-item ${typeClass}" onclick="centrerSur(${item.lat}, ${item.lng})">
        <div class="centre-icone ${typeClass}">${ICONES[item.type] || ICONES[type] || '🏥'}</div>
        <div class="centre-info">
          <div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap">
            <span class="centre-nom">${item.nom}</span>
            ${item.urgences ? '<span class="badge-urgence">URGENCES</span>' : ''}
          </div>
          <div class="centre-type">${item.type || 'Pharmacie'} · ${item.region || ''}</div>
          ${dist !== null ? `<div class="centre-distance">📍 ${formatDistance(dist)}</div>` : ''}
          ${item.horaires ? `<div class="badge-horaires">⏰ ${item.horaires}</div>` : ''}
          <div class="centre-actions">
            ${item.telephone ? `<a href="tel:${item.telephone}" class="btn-appel">📞 Appeler</a>` : ''}
            <button class="btn-itineraire" onclick="event.stopPropagation();ouvrirItineraire(${item.lat}, ${item.lng}, '${item.nom.replace(/'/g, "\\'")}')">🗺️ Y aller</button>
          </div>
        </div>
      </div>`;
  }).join('');
}

function obtenirItemsFiltres() {
  let items = [];
  if (filtreActuel === 'pharmacie') {
    items = donnees.pharmacies.map(p => ({ ...p, type: 'Pharmacie' }));
  } else if (filtreActuel === 'urgence') {
    items = donnees.centres.filter(c => c.urgences);
  } else if (filtreActuel === 'tous') {
    items = [...donnees.centres, ...donnees.pharmacies.map(p => ({ ...p, type: 'Pharmacie' }))];
  } else {
    items = donnees.centres.filter(c => c.type === filtreActuel);
  }

  if (recherche) {
    const t = recherche.toLowerCase();
    items = items.filter(i => i.nom.toLowerCase().includes(t) || (i.region||'').toLowerCase().includes(t));
  }

  if (maPosition) {
    items = items.map(i => ({ ...i, dist: distance(maPosition.lat, maPosition.lng, i.lat, i.lng) }));
    items.sort((a, b) => a.dist - b.dist);
  }

  return items;
}

function mettreAJour() {
  markersMap.forEach(m => m.remove());
  markersMap = [];
  const items = obtenirItemsFiltres();
  items.forEach(item => ajouterMarqueurs([item], item.type));
  afficherListe(items, filtreActuel);
}

window.changerFiltre = function(filtre, btn) {
  filtreActuel = filtre;
  document.querySelectorAll('.filtre-btn').forEach(b => b.classList.remove('actif'));
  btn.classList.add('actif');
  mettreAJour();
};

window.filtrer = function(terme) {
  recherche = terme;
  mettreAJour();
};

window.centrerSur = function(lat, lng) {
  if (map) map.setView([lat, lng], 15);
};

window.centrerSurMoi = function() {
  if (maPosition && map) map.setView([maPosition.lat, maPosition.lng], 14);
};

window.ouvrirItineraire = function(lat, lng, nom) {
  const url = `https://www.google.com/maps/dir/?api=1&destination=${lat},${lng}&travelmode=driving`;
  window.open(url, '_blank');
};

async function init() {
  await chargerDonnees();

  // Géolocalisation
  if (navigator.geolocation) {
    navigator.geolocation.getCurrentPosition(
      pos => {
        maPosition = { lat: pos.coords.latitude, lng: pos.coords.longitude };
        document.getElementById('statut-gps').style.background = '#4ADE80';
        initCarte(maPosition.lat, maPosition.lng);
        mettreAJour();
      },
      () => {
        // Fallback Ouagadougou
        maPosition = null;
        initCarte(12.3667, -1.5333);
        mettreAJour();
      },
      { timeout: 8000, enableHighAccuracy: true }
    );
  } else {
    initCarte(12.3667, -1.5333);
    mettreAJour();
  }
}

document.addEventListener('DOMContentLoaded', init);
</script>
</body>
</html>
