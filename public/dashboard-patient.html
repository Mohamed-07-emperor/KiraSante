<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0F6E5C" />
  <title>KiraSante BF — Mon espace santé</title>
  <link rel="manifest" href="/manifest.json" />
  <link rel="stylesheet" href="/css/design-system.css" />
  <link rel="stylesheet" href="/css/dashboard-patient.css" />
</head>
<body>

<div class="app">

  <!-- HEADER -->
  <header class="dash-header">
    <div class="dash-header-top">
      <div class="dash-logo">
        <svg viewBox="0 0 24 24" class="dash-logo-svg">
          <path d="M3 12 L6 8 L8 14 L11 4 L13 16 L15 10 L17 12 L21 12" stroke-width="2" fill="none" stroke="white" stroke-linecap="round"/>
        </svg>
        <span>KiraSante</span>
      </div>
      <div class="dash-header-actions">
        <div class="statut-point en-ligne" id="statut-point"></div>
        <button class="btn-deconnexion" id="btn-deconnexion" aria-label="Se déconnecter">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
            <polyline points="16 17 21 12 16 7"/>
            <line x1="21" y1="12" x2="9" y2="12"/>
          </svg>
        </button>
      </div>
    </div>
    <div class="dash-bienvenue">
      <p class="dash-salutation">Bonjour,</p>
      <h1 class="dash-nom" id="dash-nom">…</h1>
      <p class="dash-date" id="dash-date"></p>
    </div>
    <canvas id="ecg-header" class="ecg-canvas"></canvas>
  </header>

  <!-- CONTENU PRINCIPAL -->
  <main class="dash-main">

    <!-- CARTE SANTÉ RAPIDE -->
    <section class="section-carte-sante">
      <div class="carte-sante">
        <div class="carte-sante-header">
          <span class="carte-sante-titre">Ma carte santé</span>
          <span class="badge-role patient" id="badge-role">Patient</span>
        </div>
        <div class="carte-sante-id">
          <span class="carte-sante-label">ID Patient</span>
          <span class="carte-sante-code font-mono" id="patient-id">—</span>
        </div>
        <div class="carte-sante-infos">
          <div class="info-item">
            <span class="info-label">Groupe sanguin</span>
            <span class="info-valeur" id="groupe-sanguin">—</span>
          </div>
          <div class="info-item">
            <span class="info-label">Âge</span>
            <span class="info-valeur" id="patient-age">—</span>
          </div>
          <div class="info-item">
            <span class="info-label">District</span>
            <span class="info-valeur" id="patient-district">—</span>
          </div>
        </div>
      </div>
    </section>

    <!-- STATS RAPIDES -->
    <section class="section-stats">
      <div class="stats-grid">
        <div class="stat-carte">
          <div class="stat-icone vert">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 12h-4l-3 9L9 3l-3 9H2"/></svg>
          </div>
          <div class="stat-info">
            <span class="stat-valeur" id="stat-consultations">—</span>
            <span class="stat-label">Consultations</span>
          </div>
        </div>
        <div class="stat-carte">
          <div class="stat-icone orange">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
          </div>
          <div class="stat-info">
            <span class="stat-valeur" id="stat-vaccins">—</span>
            <span class="stat-label">Vaccinations</span>
          </div>
        </div>
        <div class="stat-carte">
          <div class="stat-icone bleu">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
          </div>
          <div class="stat-info">
            <span class="stat-valeur" id="stat-rappels">—</span>
            <span class="stat-label">Rappels</span>
          </div>
        </div>
        <div class="stat-carte">
          <div class="stat-icone rouge">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
          </div>
          <div class="stat-info">
            <span class="stat-valeur" id="stat-alertes">—</span>
            <span class="stat-label">Alertes</span>
          </div>
        </div>
      </div>
    </section>

    <!-- RAPPELS VACCINAUX -->
    <section class="section-bloc">
      <div class="bloc-header">
        <h2 class="bloc-titre">Rappels vaccinaux</h2>
        <span class="bloc-badge" id="badge-rappels">0</span>
      </div>
      <div id="liste-rappels" class="liste-vide">
        <div class="etat-chargement">
          <div class="loading-ecg"></div>
          <span>Chargement…</span>
        </div>
      </div>
    </section>

    <!-- DERNIÈRES CONSULTATIONS -->
    <section class="section-bloc">
      <div class="bloc-header">
        <h2 class="bloc-titre">Dernières consultations</h2>
      </div>
      <div id="liste-consultations" class="liste-vide">
        <div class="etat-chargement">
          <div class="loading-ecg"></div>
          <span>Chargement…</span>
        </div>
      </div>
    </section>

  </main>

  <!-- NAVIGATION BAS -->
  <nav class="nav-bas">
    <button class="nav-item actif" data-page="accueil">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
      <span>Accueil</span>
    </button>
    <button class="nav-item" data-page="consultations">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 12h-4l-3 9L9 3l-3 9H2"/></svg>
      <span>Santé</span>
    </button>
    <button class="nav-item" data-page="vaccins">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
      <span>Vaccins</span>
    </button>
    <button class="nav-item" data-page="profil">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
      <span>Profil</span>
    </button>
  </nav>

</div>

<div id="loading-overlay" class="loading-overlay">
  <div class="loading-ecg"></div>
  <span id="loading-texte" class="loading-texte">Chargement…</span>
</div>

<script src="/js/api.js"></script>
<script src="/js/dashboard-patient.js"></script>
</body>
</html>
