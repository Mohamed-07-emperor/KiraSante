<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0F6E5C" />
  <title>KiraSante BF — Mot de passe oublié</title>
  <link rel="stylesheet" href="/css/design-system.css" />
  <link rel="stylesheet" href="/css/login.css" />
</head>
<body>
<div class="page-auth">
  <header class="auth-header">
    <div class="statut-connexion">
      <span class="statut-point"></span>
      <span class="statut-texte">Vérification…</span>
    </div>
    <div class="auth-logo">
      <div class="logo-icone">
        <svg viewBox="0 0 24 24">
          <path d="M3 12 L6 8 L8 14 L11 4 L13 16 L15 10 L17 12 L21 12" stroke-width="2" fill="none"/>
        </svg>
      </div>
      <div class="logo-texte">
        <span class="logo-nom">KiraSante</span>
        <span class="logo-tagline">Santé communautaire · Burkina Faso</span>
      </div>
    </div>
    <div class="auth-bienvenue">
      <h1>Réinitialiser<br /><em>votre accès.</em></h1>
      <p>Un lien vous sera envoyé par email</p>
    </div>
    <canvas id="ecg-canvas" class="ecg-canvas"></canvas>
  </header>
  <main class="auth-carte">
    <div class="alerte" id="alerte-mdp" role="alert"></div>
    <form id="form-mdp-oublie" class="formulaire" novalidate>
      <div class="champ-groupe">
        <label class="champ-label" for="email-reset">Adresse email de votre compte</label>
        <input class="champ-input" type="email" id="email-reset" placeholder="votre@email.com" autocomplete="email" required />
      </div>
      <button type="submit" class="btn-primaire">
        <span>Envoyer le lien</span>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
      </button>
      <a href="/" class="btn-secondaire" style="text-decoration:none;margin-top:0.5rem;display:flex;align-items:center;justify-content:center;">
        ← Retour à la connexion
      </a>
    </form>
  </main>
  <footer class="auth-footer">KiraSante BF © 2026 · Offline-first</footer>
</div>
<div id="loading-overlay" class="loading-overlay">
  <div class="loading-ecg"></div>
  <span id="loading-texte" class="loading-texte">Envoi en cours…</span>
</div>
<script src="/js/api.js"></script>
<script>
if ('serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js');
(function() {
  const canvas = document.getElementById('ecg-canvas');
  if (!canvas) return;
  const ctx = canvas.getContext('2d');
  let phase = 0;
  function valeurECG(t) {
    const c = t % 1;
    if (c < 0.3)  return Math.sin(c * Math.PI * 2) * 0.15;
    if (c < 0.4)  return -0.1;
    if (c < 0.42) return -0.3;
    if (c < 0.45) return 1.0;
    if (c < 0.48) return -0.25;
    if (c < 0.6)  return Math.sin((c-0.48)*Math.PI/0.12)*0.2;
    return 0;
  }
  function draw() {
    canvas.width = canvas.offsetWidth;
    canvas.height = canvas.offsetHeight;
    ctx.clearRect(0,0,canvas.width,canvas.height);
    ctx.beginPath(); ctx.strokeStyle='#fff'; ctx.lineWidth=1.5;
    for (let i=0;i<canvas.width;i++) {
      const y = canvas.height/2 - valeurECG((i/canvas.width)*2+phase)*(canvas.height*0.4);
      i===0 ? ctx.moveTo(i,y) : ctx.lineTo(i,y);
    }
    ctx.stroke(); phase+=0.003;
    requestAnimationFrame(draw);
  }
  draw();
})();
document.getElementById('form-mdp-oublie').addEventListener('submit', async (e) => {
  e.preventDefault();
  const email = document.getElementById('email-reset').value.trim();
  const alerte = document.getElementById('alerte-mdp');
  const btn = e.target.querySelector('.btn-primaire');
  const overlay = document.getElementById('loading-overlay');
  if (!email) {
    alerte.textContent = 'Veuillez entrer votre adresse email.';
    alerte.className = 'alerte visible erreur';
    return;
  }
  btn.disabled = true;
  overlay.classList.add('visible');
  try {
    await Api.requete('POST', '/auth/mot-de-passe-oublie', { email });
    overlay.classList.remove('visible');
    alerte.textContent = '✅ Lien envoyé ! Vérifiez votre boîte email.';
    alerte.className = 'alerte visible succes';
    btn.disabled = false;
  } catch (err) {
    overlay.classList.remove('visible');
    btn.disabled = false;
    alerte.textContent = err.estOffline ? '📡 Hors ligne — impossible d\'envoyer le lien.' : (err.message || 'Une erreur est survenue.');
    alerte.className = 'alerte visible erreur';
  }
});
</script>
</body>
</html>
