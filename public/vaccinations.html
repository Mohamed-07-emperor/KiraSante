<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0F6E5C" />
  <title>KiraSante BF — Vaccinations</title>
  <link rel="stylesheet" href="/css/design-system.css" />
  <link rel="stylesheet" href="/css/dashboard-agent.css" />
</head>
<body>
<div class="app">

  <header class="dash-header">
    <div class="dash-header-top">
      <button class="btn-deconnexion" onclick="history.back()" style="background:rgba(255,255,255,0.15)">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 18 9 12 15 6"/></svg>
      </button>
      <div class="dash-logo"><span>Vaccinations</span></div>
      <button class="btn-fab" onclick="ouvrirFormVaccin()" style="width:36px;height:36px;font-size:1.2rem">+</button>
    </div>
    <canvas id="ecg-header" class="ecg-canvas"></canvas>
  </header>

  <main class="dash-main" style="margin-top:0">

    <!-- STATS -->
    <div class="stats-grid">
      <div class="stat-carte">
        <div class="stat-icone vert">💉</div>
        <div class="stat-info"><span class="stat-valeur" id="stat-total">—</span><span class="stat-label">Total vaccinations</span></div>
      </div>
      <div class="stat-carte">
        <div class="stat-icone orange">📅</div>
        <div class="stat-info"><span class="stat-valeur" id="stat-rappels">—</span><span class="stat-label">Rappels (7j)</span></div>
      </div>
    </div>

    <!-- RECHERCHE PATIENT -->
    <div class="search-bar">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <input type="text" id="search-patient-vaccin" placeholder="Rechercher un patient…" oninput="filtrerPatientsVaccin(this.value)" />
    </div>

    <!-- LISTE PATIENTS AVEC VACCINS -->
    <div id="liste-vaccinations"><div class="etat-chargement"><div class="loading-ecg"></div><span>Chargement…</span></div></div>

  </main>

</div>

<!-- MODAL NOUVEAU VACCIN -->
<div id="modal-vaccin" class="modal">
  <div class="modal-overlay" onclick="fermerModal('modal-vaccin')"></div>
  <div class="modal-contenu">
    <div class="modal-header">
      <h3>Enregistrer une vaccination</h3>
      <button class="modal-fermer" onclick="fermerModal('modal-vaccin')">✕</button>
    </div>
    <form id="form-vaccin" class="formulaire" novalidate>
      <div class="alerte" id="alerte-vaccin" role="alert"></div>
      <div class="champ-groupe">
        <label class="champ-label">Patient *</label>
        <select class="champ-input" id="v-patient" required>
          <option value="">-- Sélectionner --</option>
        </select>
      </div>
      <div class="champ-groupe">
        <label class="champ-label">Vaccin *</label>
        <select class="champ-input" id="v-nom" required>
          <option value="">-- Sélectionner --</option>
          <option>BCG</option>
          <option>DTC-HepB-Hib (Pentavalent)</option>
          <option>Polio oral (VPO)</option>
          <option>Polio injectable (VPI)</option>
          <option>Pneumocoque (PCV13)</option>
          <option>Rotavirus</option>
          <option>Rougeole-Rubéole (RR)</option>
          <option>Méningite A (MenAfriVac)</option>
          <option>Fièvre jaune</option>
          <option>COVID-19</option>
          <option>Tétanos (VAT)</option>
          <option>Autre</option>
        </select>
      </div>
      <div class="champ-groupe">
        <label class="champ-label">Date d'administration *</label>
        <input class="champ-input" type="date" id="v-date" required />
      </div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:1rem">
        <div class="champ-groupe">
          <label class="champ-label">Numéro de lot</label>
          <input class="champ-input" type="text" id="v-lot" placeholder="LOT-2026-XXX" />
        </div>
        <div class="champ-groupe">
          <label class="champ-label">Prochain rappel</label>
          <input class="champ-input" type="date" id="v-rappel" />
        </div>
      </div>
      <button type="submit" class="btn-primaire">💉 Enregistrer la vaccination</button>
    </form>
  </div>
</div>

<div id="loading-overlay" class="loading-overlay">
  <div class="loading-ecg"></div>
  <span class="loading-texte">Chargement…</span>
</div>

<script src="/js/api.js"></script>
<script>
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.getRegistrations().then(regs => regs.forEach(r => r.unregister()));
}

// ECG
(function() {
  const canvas = document.getElementById('ecg-header');
  if (!canvas) return;
  const ctx = canvas.getContext('2d');
  let phase = 0;
  function valeurECG(t) {
    const c = t % 1;
    if (c < 0.3) return Math.sin(c * Math.PI * 2) * 0.15;
    if (c < 0.4) return -0.1;
    if (c < 0.42) return -0.3;
    if (c < 0.45) return 1.0;
    if (c < 0.48) return -0.25;
    if (c < 0.6) return Math.sin((c-0.48)*Math.PI/0.12)*0.2;
    return 0;
  }
  function draw() {
    canvas.width = canvas.offsetWidth;
    canvas.height = canvas.offsetHeight;
    ctx.clearRect(0,0,canvas.width,canvas.height);
    ctx.beginPath(); ctx.strokeStyle='rgba(255,255,255,0.18)'; ctx.lineWidth=1.5;
    for (let i=0;i<canvas.width;i++) {
      const y = canvas.height/2 - valeurECG((i/canvas.width)*2+phase)*(canvas.height*0.4);
      i===0 ? ctx.moveTo(i,y) : ctx.lineTo(i,y);
    }
    ctx.stroke(); phase+=0.003;
    requestAnimationFrame(draw);
  }
  draw();
})();

let tousPatients = [];

function afficherLoading(msg) {
  const o = document.getElementById('loading-overlay');
  const t = document.querySelector('.loading-texte');
  if (o) o.classList.add('visible');
  if (t) t.textContent = msg || 'Chargement…';
}
function cacherLoading() {
  const o = document.getElementById('loading-overlay');
  if (o) o.classList.remove('visible');
}

window.ouvrirFormVaccin = function() {
  const modal = document.getElementById('modal-vaccin');
  if (modal) modal.classList.add('visible');
  const select = document.getElementById('v-patient');
  if (select && tousPatients.length) {
    select.innerHTML = '<option value="">-- Sélectionner --</option>' +
      tousPatients.map(p => `<option value="${p.id}">${p.prenom} ${p.nom}</option>`).join('');
  }
  // Date par défaut = aujourd'hui
  const dateEl = document.getElementById('v-date');
  if (dateEl) dateEl.value = new Date().toISOString().split('T')[0];
};

window.fermerModal = function(id) {
  const m = document.getElementById(id);
  if (m) m.classList.remove('visible');
};

async function chargerVaccinations() {
  const liste = document.getElementById('liste-vaccinations');
  try {
    const patientsData = await Api.requete('GET', '/patients');
    tousPatients = patientsData.data?.patients || [];
    const rappelsData = await Api.requete('GET', '/dashboard/rappels');
    const rappels = rappelsData.data?.rappels || [];
    const el1 = document.getElementById('stat-rappels');
    if (el1) el1.textContent = rappels.length;

    let totalVaccins = 0;
    const items = [];

    for (const p of tousPatients.slice(0, 20)) {
      try {
        const vData = await Api.requete('GET', `/vaccinations/patient/${p.id}`);
        const vaccins = vData.data?.vaccinations || vData.vaccinations || [];
        totalVaccins += vaccins.length;
        if (vaccins.length > 0) {
          items.push({ patient: p, vaccins });
        }
      } catch(e) {}
    }

    const el2 = document.getElementById('stat-total');
    if (el2) el2.textContent = totalVaccins;

    if (!items.length) {
      liste.innerHTML = `<div class="etat-vide"><span>💉</span><span>Aucune vaccination enregistrée</span></div>`;
      return;
    }

    afficherVaccinations(items);
  } catch(e) {
    liste.innerHTML = `<div class="etat-vide"><span>Erreur de chargement</span></div>`;
  }
}

function afficherVaccinations(items) {
  const liste = document.getElementById('liste-vaccinations');
  liste.innerHTML = items.map(({ patient: p, vaccins }) => {
    const initiales = `${(p.prenom||'?')[0]}${(p.nom||'?')[0]}`.toUpperCase();
    return `<div class="section-bloc">
      <div class="bloc-header">
        <div style="display:flex;align-items:center;gap:12px">
          <div class="patient-avatar" style="width:36px;height:36px;font-size:var(--text-base)">${initiales}</div>
          <span class="bloc-titre" style="font-size:var(--text-base)">${p.prenom} ${p.nom}</span>
        </div>
        <span class="bloc-badge">${vaccins.length}</span>
      </div>
      ${vaccins.map(v => {
        const dateAdmin = v.date_admin ? new Date(v.date_admin).toLocaleDateString('fr-FR') : '—';
        const dateRappel = v.prochain_rappel ? new Date(v.prochain_rappel).toLocaleDateString('fr-FR') : null;
        const diff = v.prochain_rappel ? Math.ceil((new Date(v.prochain_rappel)-new Date())/(1000*60*60*24)) : null;
        const statut = diff !== null ? (diff < 0 ? 'urgent' : diff <= 7 ? 'urgent' : 'normal') : null;
        return `<div class="rappel-item">
          <div class="rappel-icone">💉</div>
          <div class="rappel-info">
            <div class="rappel-nom">${v.vaccin_nom}</div>
            <div class="rappel-date">Administré le ${dateAdmin}${v.lot ? ` · Lot: ${v.lot}` : ''}</div>
          </div>
          ${dateRappel ? `<span class="rappel-statut ${statut}">${diff < 0 ? 'Retard' : dateRappel}</span>` : ''}
        </div>`;
      }).join('')}
    </div>`;
  }).join('');
}

window.filtrerPatientsVaccin = function(terme) {
  // Recharger avec filtre
};

document.getElementById('form-vaccin')?.addEventListener('submit', async (e) => {
  e.preventDefault();
  const patient_id  = document.getElementById('v-patient').value;
  const vaccin_nom  = document.getElementById('v-nom').value;
  const date_admin  = document.getElementById('v-date').value;
  const lot         = document.getElementById('v-lot').value.trim();
  const prochain_rappel = document.getElementById('v-rappel').value;
  const alerte      = document.getElementById('alerte-vaccin');
  const btn         = e.target.querySelector('.btn-primaire');

  if (!patient_id || !vaccin_nom || !date_admin) {
    alerte.textContent = 'Patient, vaccin et date sont obligatoires.';
    alerte.className = 'alerte visible erreur';
    return;
  }

  btn.disabled = true;
  afficherLoading('Enregistrement…');
  try {
    await Api.requete('POST', '/vaccinations', { patient_id, vaccin_nom, date_admin, lot, prochain_rappel });
    cacherLoading();
    alerte.textContent = '✅ Vaccination enregistrée !';
    alerte.className = 'alerte visible succes';
    await chargerVaccinations();
    setTimeout(() => { fermerModal('modal-vaccin'); e.target.reset(); }, 1200);
  } catch(err) {
    cacherLoading();
    btn.disabled = false;
    alerte.textContent = err.message || 'Erreur enregistrement';
    alerte.className = 'alerte visible erreur';
  }
});

document.addEventListener('DOMContentLoaded', () => {
  if (!Api.estConnecte()) { window.location.href = '/'; return; }
  chargerVaccinations();
});
</script>
</body>
</html>
