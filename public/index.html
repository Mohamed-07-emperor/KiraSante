<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0F6E5C" />
  <meta name="description" content="KiraSante BF — Suivi de santé communautaire pour le Burkina Faso" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>KiraSante BF — Connexion</title>
  <link rel="manifest" href="/manifest.json" />
  <link rel="stylesheet" href="/css/design-system.css" />
  <link rel="stylesheet" href="/css/login.css" />
</head>
<body>
<div class="page-auth">

  <header class="auth-header">
    <div class="statut-connexion">
      <span class="statut-point"></span>
      <span class="statut-texte">Vérification…</span>
    </div>
    <div class="auth-logo">
      <div class="logo-icone">
        <svg viewBox="0 0 24 24">
          <path d="M3 12 L6 8 L8 14 L11 4 L13 16 L15 10 L17 12 L21 12" stroke-width="2" fill="none"/>
        </svg>
      </div>
      <div class="logo-texte">
        <span class="logo-nom">KiraSante</span>
        <span class="logo-tagline">Santé communautaire · Burkina Faso</span>
      </div>
    </div>
    <div class="auth-bienvenue">
      <h1>Suivre des vies,<br /><em>pas des dossiers.</em></h1>
      <p>Plateforme de suivi de santé offline-first</p>
    </div>
    <canvas id="ecg-canvas" class="ecg-canvas"></canvas>
  </header>

  <main class="auth-carte">
    <div class="onglets" role="tablist">
      <button id="btn-onglet-login" class="onglet-btn actif" role="tab" aria-selected="true">Connexion</button>
      <button id="btn-onglet-inscription" class="onglet-btn" role="tab" aria-selected="false">Créer un compte</button>
    </div>

    <form id="form-login" class="formulaire" novalidate>
      <div class="alerte" id="alerte-login" role="alert"></div>
      <div class="champ-groupe">
        <label class="champ-label" for="login-email">Adresse email</label>
        <input class="champ-input" type="email" id="login-email" placeholder="votre@email.com" autocomplete="email" required />
      </div>
      <div class="champ-groupe">
        <label class="champ-label" for="login-mdp">Mot de passe</label>
        <div class="input-mdp-groupe">
          <input class="champ-input" type="password" id="login-mdp" placeholder="••••••••" autocomplete="current-password" required />
          <button type="button" class="toggle-mdp" aria-label="Afficher le mot de passe">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
          </button>
        </div>
      </div>
      <div class="lien-mdp-oublie"><a href="/mot-de-passe-oublie.html">Mot de passe oublié ?</a></div>
      <button type="submit" class="btn-primaire">
        <span>Se connecter</span>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
      </button>
    </form>

    <form id="form-inscription" class="formulaire cache" novalidate>
      <div class="alerte" id="alerte-inscription" role="alert"></div>
      <div class="champ-groupe">
        <label class="champ-label">Je suis…</label>
        <div class="role-selector">
          <div class="role-carte selectionnee" data-role="patient" tabindex="0">
            <span class="role-emoji">🏥</span>
            <span class="role-nom">Patient</span>
          </div>
          <div class="role-carte" data-role="agent_sante" tabindex="0">
            <span class="role-emoji">👨‍⚕️</span>
            <span class="role-nom">Agent de santé</span>
          </div>
          <div class="role-carte" data-role="admin" tabindex="0">
            <span class="role-emoji">⚙️</span>
            <span class="role-nom">Admin</span>
          </div>
        </div>
        <input type="hidden" id="input-role" value="patient" />
      </div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:1rem;">
        <div class="champ-groupe">
          <label class="champ-label" for="inscrip-prenom">Prénom</label>
          <input class="champ-input" type="text" id="inscrip-prenom" placeholder="Moussa" autocomplete="given-name" required />
        </div>
        <div class="champ-groupe">
          <label class="champ-label" for="inscrip-nom">Nom</label>
          <input class="champ-input" type="text" id="inscrip-nom" placeholder="Traoré" autocomplete="family-name" required />
        </div>
      </div>
      <div class="champ-groupe">
        <label class="champ-label" for="inscrip-email">Adresse email</label>
        <input class="champ-input" type="email" id="inscrip-email" placeholder="votre@email.com" autocomplete="email" required />
      </div>
      <div class="champ-groupe">
        <label class="champ-label" for="inscrip-mdp">Mot de passe</label>
        <div class="input-mdp-groupe">
          <input class="champ-input" type="password" id="inscrip-mdp" placeholder="8 caractères minimum" autocomplete="new-password" required />
          <button type="button" class="toggle-mdp" aria-label="Afficher le mot de passe">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
          </button>
        </div>
      </div>
      <div class="champ-groupe">
        <label class="champ-label" for="inscrip-mdp2">Confirmer le mot de passe</label>
        <div class="input-mdp-groupe">
          <input class="champ-input" type="password" id="inscrip-mdp2" placeholder="••••••••" autocomplete="new-password" required />
          <button type="button" class="toggle-mdp" aria-label="Afficher le mot de passe">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
          </button>
        </div>
      </div>
      <button type="submit" class="btn-primaire">
        <span>Créer mon compte</span>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><line x1="19" y1="8" x2="19" y2="14"/><line x1="22" y1="11" x2="16" y2="11"/></svg>
      </button>
    </form>
  </main>

  <footer class="auth-footer">
    KiraSante BF © 2026 · Données stockées localement · Offline-first
  </footer>
</div>

<div id="loading-overlay" class="loading-overlay">
  <div class="loading-ecg"></div>
  <span id="loading-texte" class="loading-texte">Chargement…</span>
</div>

<script src="/js/api.js"></script>
<script src="/js/app.js"></script>
</body>
</html>
